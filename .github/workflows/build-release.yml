name: Build Release RPK

# 触发条件：
#   1. 推送 v* tag 时（自动构建并创建 GitHub Release）
#   2. 手动触发（Actions 页面 → Run workflow，只上传 artifact）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release RPK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 小米 Vela 快应用官方工具链
      # hap-toolkit 是快应用联盟标准工具（小米/华为/OPPO/vivo 共用），最新 2.0.9
      - name: Install hap-toolkit
        run: |
          npm install -g hap-toolkit
          hap --version

      # 验证签名文件存在
      - name: Verify signing materials
        run: |
          ls -la sign/debug/ sign/release/
          for f in sign/debug/private.pem sign/debug/certificate.pem \
                   sign/release/private.pem sign/release/certificate.pem; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f"
              exit 1
            fi
            head -1 "$f"
          done

      # 编译并签名 RPK
      # hap-toolkit 期望 src/manifest.json（快应用联盟标准结构）
      # 我们的 manifest.json 在仓库根（Vela IDE 兼容），CI 时复制到 src/
      # app.ux 也在根，引用 ./src/utils/...；复制到 src/ 后改引用为 ./utils/...
      - name: Prepare hap-toolkit project structure
        run: |
          echo "=== prepare src/ layout for hap-toolkit ==="
          cp manifest.json src/manifest.json
          # app.ux 复制到 src/，并把 ./src/utils/ 引用改为 ./utils/
          sed 's|\./src/utils/|./utils/|g' app.ux > src/app.ux
          echo "=== src/ contents ==="
          ls -la src/
          echo "=== src/app.ux head ==="
          head -5 src/app.ux

      - name: Build release RPK
        run: |
          echo "=== hap version ==="
          hap --version
          echo "=== hap help ==="
          hap --help 2>&1 | head -30
          echo "=== try hap build ==="
          hap build 2>&1 | tee build.log || true
          if ! find . -name "*.rpk" -type f | grep -q .; then
            echo "=== retry with hap release ==="
            hap release 2>&1 | tee -a build.log || true
          fi
          if ! find . -name "*.rpk" -type f | grep -q .; then
            echo "=== retry with npx hap build ==="
            npx hap build 2>&1 | tee -a build.log
          fi
          echo "=== build.log tail ==="
          tail -60 build.log
          echo "=== .rpk files ==="
          find . -name "*.rpk" -type f
          # 检查最终是否有 rpk
          if ! find . -name "*.rpk" -type f | grep -q .; then
            echo "ERROR: no .rpk produced"
            exit 1
          fi

      # 列出产物
      - name: List build outputs
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/ 2>/dev/null || ls -lh build/ 2>/dev/null || true
          echo "=== all .rpk files ==="
          find . -name "*.rpk" -type f

      # 重命名为规范名称
      - name: Rename RPK
        id: rename
        run: |
          RPK=$(find . -name "*.rpk" -type f | head -1)
          if [ -z "$RPK" ]; then
            echo "ERROR: no .rpk found"
            exit 1
          fi
          VERSION=${GITHUB_REF_NAME:-dev}
          DEST="tgwear-quickapp-${VERSION}.rpk"
          cp "$RPK" "$DEST"
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      # 上传 artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgwear-quickapp-release-rpk
          path: ${{ steps.rename.outputs.dest }}
          retention-days: 30

      # tag 推送时创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.dest }}
          name: TG Wear Quick-app ${{ github.ref_name }}
          body: |
            ## TG Wear Quick-app ${{ github.ref_name }}

            小米 Vela 穿戴设备快应用端（手环 / 手表）。

            ### 签名信息

            - 使用本仓库 `sign/release/*.pem` 签名
            - 与手机端 `tgwear-android-patch/signing/tgwear.jks` 同源
            - 两端签名一致是 interconnect 通信的前提

            ### 安装

            1. 下载 `tgwear-quickapp-${{ github.ref_name }}.rpk` 到手机
            2. 通过小米穿戴 App 推送到手表（或 `adb push` 到 `/sdcard/` 后由系统安装器安装）
            3. 配套手机端：[tgwear-android-patch releases](https://github.com/hrk666666/tgwear-android-patch/releases)

            ### 对应的 Android 端

            见 [tgwear-android-patch ${{ github.ref_name }}](https://github.com/hrk666666/tgwear-android-patch/releases/tag/${{ github.ref_name }})
          draft: false
          prerelease: false
          generate_release_notes: false
