name: Build Release RPK

# 触发条件：
#   1. 推送 v* tag 时（自动构建并创建 GitHub Release）
#   2. 手动触发（Actions 页面 → Run workflow，只上传 artifact）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release RPK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 小米 Vela 快应用官方工具链：aiot-toolkit
      # 项目结构对齐 https://github.com/youshen2/com.bandbbs.ebook
      # manifest.json / app.ux 都在 src/ 下（aiot-toolkit 标准布局）
      - name: Install dependencies
        run: |
          npm install
          npx aiot --version 2>&1 || true

      # 下载 DrKLO/Telegram 的 launcher 图标作为应用图标
      # 源: mipmap-xxxhdpi/ic_launcher.png (192x192)
      # 目标: src/common/icon.png（与 manifest.json 的 icon 字段一致）
      - name: Download Telegram icon
        run: |
          curl -sL -o src/common/icon.png \
            "https://raw.githubusercontent.com/DrKLO/Telegram/release-11.4.2-5469/TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          ls -lh src/common/icon.png
          file src/common/icon.png

      # 验证签名文件存在
      - name: Verify signing materials
        run: |
          ls -la sign/debug/ sign/release/
          for f in sign/debug/private.pem sign/debug/certificate.pem \
                   sign/release/private.pem sign/release/certificate.pem; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f"
              exit 1
            fi
            head -1 "$f"
          done

      # 校验 aiot-toolkit 标准项目结构
      - name: Verify project structure
        run: |
          echo "=== root ==="
          ls -la
          echo "=== src/ ==="
          ls -la src/
          echo "=== src/manifest.json head ==="
          head -5 src/manifest.json
          echo "=== src/app.ux head ==="
          head -3 src/app.ux

      # 编译并签名 RPK
      # aiot-toolkit 期望 src/manifest.json 和 src/app.ux（已在 src/ 下，无需复制）
      - name: Build release RPK
        run: |
          echo "=== aiot release ==="
          npm run release 2>&1 | tee build.log || true
          if ! find . -name "*.rpk" -type f | grep -q .; then
            echo "=== retry: npx aiot release ==="
            npx aiot release --enable-custom-component --enable-jsc 2>&1 | tee -a build.log || true
          fi
          if ! find . -name "*.rpk" -type f | grep -q .; then
            echo "=== retry: npx aiot build ==="
            npx aiot build --enable-custom-component 2>&1 | tee -a build.log || true
          fi
          echo "=== build.log tail ==="
          tail -80 build.log
          echo "=== .rpk files ==="
          find . -name "*.rpk" -type f
          if ! find . -name "*.rpk" -type f | grep -q .; then
            echo "ERROR: no .rpk produced"
            exit 1
          fi

      # 列出产物
      - name: List build outputs
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/ 2>/dev/null || ls -lh build/ 2>/dev/null || true
          echo "=== all .rpk files ==="
          find . -name "*.rpk" -type f

      # 重命名为规范名称
      - name: Rename RPK
        id: rename
        run: |
          RPK=$(find . -name "*.rpk" -type f | head -1)
          if [ -z "$RPK" ]; then
            echo "ERROR: no .rpk found"
            exit 1
          fi
          VERSION=${GITHUB_REF_NAME:-dev}
          DEST="tgwear-quickapp-${VERSION}.rpk"
          cp "$RPK" "$DEST"
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      # 上传 artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgwear-quickapp-release-rpk
          path: ${{ steps.rename.outputs.dest }}
          retention-days: 30

      # tag 推送时创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.dest }}
          name: TG Wear Quick-app ${{ github.ref_name }}
          body: |
            ## TG Wear Quick-app ${{ github.ref_name }}

            小米 Vela 穿戴设备快应用端（手环 / 手表）。

            ### 签名信息

            - 使用本仓库 `sign/release/*.pem` 签名
            - 与手机端 `tgwear-android-patch/signing/tgwear.jks` 同源
            - 两端签名一致是 interconnect 通信的前提

            ### 安装

            1. 下载 `tgwear-quickapp-${{ github.ref_name }}.rpk` 到手机
            2. 通过小米穿戴 App 推送到手表（或 `adb push` 到 `/sdcard/` 后由系统安装器安装）
            3. 配套手机端：[tgwear-android-patch releases](https://github.com/hrk666666/tgwear-android-patch/releases)

            ### 对应的 Android 端

            见 [tgwear-android-patch ${{ github.ref_name }}](https://github.com/hrk666666/tgwear-android-patch/releases/tag/${{ github.ref_name }})
          draft: false
          prerelease: false
          generate_release_notes: false
